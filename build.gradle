buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = mod_version
group = mod_group
archivesBaseName = mod_id

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

// 源码含中文，统一按 UTF-8 编译（Windows 下 javac 默认取 GBK 会导致乱码报错）
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    version = "${mc_version}-${forge_version}"
    runDir = 'run'
    mappings = mcp_mappings
    makeObfSourceJar = false
}

// 不要用 expand 往 mcmod.info 里注入版本号：Gradle 的过滤按平台默认编码（Windows 上是 GBK）读写，
// UTF-8 的中文描述会被写坏成乱码。版本号直接写在 mcmod.info 里，资源原样复制。
processResources {
    filteringCharset = 'UTF-8'
    from(sourceSets.main.resources.srcDirs)
}

repositories {
    mavenCentral()
}

// 「点击坐标」要用真正的鼠标事件：系统级点击是唯一能让 shift+左键、右键、界面外坐标都生效的办法。
// JNA 只用来问 Windows 游戏窗口的客户区在屏幕上的位置，打包进 jar，不依赖其他 mod。
configurations {
    embed
}

dependencies {
    embed 'net.java.dev.jna:jna:4.5.2'
}

sourceSets.main.compileClasspath += configurations.embed

jar {
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/maven/**'
    manifest {
        attributes(
            'Specification-Title': mod_name,
            'Specification-Vendor': 'Rain',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Rain'
        )
    }
}
