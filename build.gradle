buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "${mod_version}${version_suffix}"
group = mod_group
archivesBaseName = mod_id

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

// 源码含中文，统一按 UTF-8 编译（Windows 下 javac 默认取 GBK 会导致乱码报错）
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

minecraft {
    version = "${mc_version}-${forge_version}"
    runDir = 'run'
    mappings = mcp_mappings
    makeObfSourceJar = false
}

// mcmod.info 里的版本号按构建版本注入（1.2.10a 这种测试版号），中文描述按 UTF-8 读写。
processResources {
    inputs.property 'version', project.version
    filteringCharset = 'UTF-8'
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

repositories {
    mavenCentral()
}

// Baritone 只编译期引用：玩家自己装 Baritone 时寻路才生效，没装就回退到内置行走。
// 这个 jar 不随仓库分发（.gitignore 忽略 *.jar）；本地没有时跳过，照样能编译。
dependencies {
    File baritone = file('libs/baritone-api-forge-1.2.19.jar')
    if (baritone.exists()) {
        compileOnly files(baritone)
    }
}

jar {
    manifest {
        attributes(
            'Specification-Title': mod_name,
            'Specification-Vendor': 'Rain',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Rain'
        )
    }
}
